<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بوفيه قناة السويس الملاحي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #d2b48c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 71, 161, 0.85);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 5;
      text-align: center;
    }
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: #ffffff;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      text-align: center;
      z-index: 20;
      width: 85%;
      max-width: 340px;
      transition: transform 0.2s ease;
      border: 3px solid #0288d1;
    }
    .modal.active {
      display: block;
      transform: translate(-50%, -50%) scale(1);
    }
    .modal-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }
    .modal h3 { color: #0d47a1; margin-bottom: 8px; font-size: 19px; }
    .modal p { color: #555; font-size: 14px; margin-bottom: 18px; }
    .btn-group { display: flex; gap: 10px; justify-content: center; }
    .btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-confirm { background-color: #2e7d32; color: white; }
    .btn-cancel { background-color: #c62828; color: white; }
    
    .controls {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 10;
    }
    .ctrl-btn {
      width: 65px;
      height: 65px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #0d47a1;
      border-radius: 50%;
      font-size: 26px;
      color: #0d47a1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
      touch-action: none;
    }
    .ctrl-btn:active {
      background: #0d47a1;
      color: white;
    }
  </style>
</head>
<body>

  <div class="hud">⚓ قم بقيادة السفينة واقترب من ضفاف القناة لاكتشاف المشروبات</div>
  <canvas id="gameCanvas"></canvas>

  <div class="controls">
    <button class="ctrl-btn" id="leftBtn">◀</button>
    <button class="ctrl-btn" id="upBtn">▲</button>
    <button class="ctrl-btn" id="rightBtn">▶</button>
  </div>

  <div class="modal" id="orderModal">
    <div class="modal-icon" id="modalIcon">☕</div>
    <h3 id="modalTitle">محطة ضيافة</h3>
    <p id="modalDesc"></p>
    <div class="btn-group">
      <button class="btn btn-confirm" id="confirmBtn">تأكيد ورسو</button>
      <button class="btn btn-cancel" id="cancelBtn">متابعة الإبحار</button>
    </div>
  </div>

  <script>
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID"; // استبدل برابط Formspree الخاص بك

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const modal = document.getElementById('orderModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalIcon = document.getElementById('modalIcon');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const ship = {
      x: width / 2,
      y: height * 0.75,
      width: 36,
      height: 65,
      speed: 3.8,
      turnSpeed: 0.04,
      angle: -Math.PI / 2, // موجه لأعلى
      movingUp: false,
      movingLeft: false,
      movingRight: false,
      wake: []
    };

    // قائمة المشروبات والمحطات على طول القناة
    const stations = [
      { id: 1, name: "شاي كشري أصيل", icon: "☕", side: "right", worldY: -350, triggered: false },
      { id: 2, name: "قهوة تركي مضبوط", icon: "☕", side: "left", worldY: -750, triggered: false },
      { id: 3, name: "إسبريسو إيطالي دبل", icon: "🥃", side: "right", worldY: -1150, triggered: false },
      { id: 4, name: "عصير مانجو فريش", icon: "🍹", side: "left", worldY: -1550, triggered: false },
      { id: 5, name: "ليمون نعناع مثلج", icon: "🍋", side: "right", worldY: -1950, triggered: false },
      { id: 6, name: "مياه معدنية مثلجة", icon: "🧊", side: "left", worldY: -2350, triggered: false }
    ];

    let activeStation = null;
    let cameraY = 0;
    let waterWaveOffset = 0;
    const DISCOVERY_RADIUS = 280; // المسافة التي يبدأ عندها المشروب بالظهور تدريجياً

    function drawCanal() {
      const canalLeft = width * 0.22;
      const canalWidth = width * 0.56;
      const canalRight = canalLeft + canalWidth;

      // رمال الضفة الشرقية والغربية
      ctx.fillStyle = '#e4c483';
      ctx.fillRect(0, 0, width, height);

      // مياه المجرى الملاحي
      ctx.fillStyle = '#0277bd';
      ctx.fillRect(canalLeft, 0, canalWidth, height);

      // رسم أمواج خفيفة متحركة
      waterWaveOffset += 0.03;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      for (let y = 0; y < height; y += 45) {
        ctx.beginPath();
        const waveShift = Math.sin(waterWaveOffset + y * 0.05) * 8;
        ctx.moveTo(canalLeft, y);
        ctx.bezierCurveTo(
          canalLeft + canalWidth * 0.3 + waveShift, y - 5,
          canalLeft + canalWidth * 0.7 - waveShift, y + 5,
          canalRight, y
        );
        ctx.stroke();
      }

      // خط التوجيه الملاحي الأوسط
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.setLineDash([20, 15]);
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawShipWake() {
      // رسم أثر أمواج السفينة
      ctx.save();
      for (let i = 0; i < ship.wake.length; i++) {
        const p = ship.wake[i];
        p.alpha -= 0.015;
        p.size += 0.6;
        if (p.alpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y - cameraY, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ship.wake = ship.wake.filter(p => p.alpha > 0);
      ctx.restore();
    }

    function drawStations() {
      const shipWorldY = ship.y + cameraY;

      stations.forEach(st => {
        const renderY = st.worldY - cameraY;
        const isLeft = st.side === 'left';
        const canalEdge = isLeft ? (width * 0.22) : (width * 0.78);
        const dockX = isLeft ? canalEdge - 15 : canalEdge + 15;
        const dockWidth = 90;
        const dockHeight = 70;
        const drawX = isLeft ? dockX - dockWidth : dockX;

        // حساب المسافة الحقيقية بين السفينة والمحطة
        const dist = Math.hypot(ship.x - dockX, shipWorldY - st.worldY);

        // إذا كانت السفينة قريبة، يتم حساب نسبة الظهور (Fade-in / Scale-in)
        if (dist < DISCOVERY_RADIUS) {
          const visibility = Math.min(1, Math.max(0, 1 - (dist - 50) / (DISCOVERY_RADIUS - 50)));
          const scale = 0.6 + (visibility * 0.4);

          ctx.save();
          ctx.globalAlpha = visibility;
          ctx.translate(drawX + dockWidth / 2, renderY);
          ctx.scale(scale, scale);

          // تأثير توهج حول الرصيف عند الاقتراب الشديد
          if (dist < 130) {
            ctx.shadowColor = '#ffb300';
            ctx.shadowBlur = 15;
          }

          // خلفية الرصيف / المحطة
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#0d47a1';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-dockWidth / 2, -dockHeight / 2, dockWidth, dockHeight, 10);
          ctx.fill();
          ctx.stroke();

          // أيقونة المشروب
          ctx.font = '24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(st.icon, 0, -6);

          // اسم المشروب
          ctx.fillStyle = '#0d47a1';
          ctx.font = 'bold 11px Tahoma';
          ctx.fillText(st.name, 0, 20);

          ctx.restore();

          // نافذة التأكيد عند الرسو بالقرب من الحافة
          if (dist < 85 && !st.triggered && !activeStation) {
            triggerDocking(st);
          }
        }
      });
    }

    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle + Math.PI / 2);

      // بدن السفينة
      ctx.fillStyle = '#d32f2f';
      ctx.beginPath();
      ctx.moveTo(0, -ship.height / 2);
      ctx.bezierCurveTo(ship.width / 2, -ship.height / 4, ship.width / 2, ship.height / 2, 0, ship.height / 2);
      ctx.bezierCurveTo(-ship.width / 2, ship.height / 2, -ship.width / 2, -ship.height / 4, 0, -ship.height / 2);
      ctx.fill();
      ctx.strokeStyle = '#801313';
      ctx.lineWidth = 2;
      ctx.stroke();

      // مقدمة بيضاء ومقصورة القيادة
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-ship.width / 4, -ship.height / 6, ship.width / 2, ship.height / 2.5);
      
      // المدخنة البحرية
      ctx.fillStyle = '#212121';
      ctx.beginPath();
      ctx.arc(0, ship.height / 8, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function triggerDocking(station) {
      activeStation = station;
      modalIcon.innerText = station.icon;
      modalTitle.innerText = station.name;
      modalDesc.innerText = `اقتربت سفينتك من رصيف (${station.name}). هل ترغب في طلب هذا المشروب للصالون؟`;
      modal.classList.add('active');
    }

    document.getElementById('cancelBtn').onclick = () => {
      modal.classList.remove('active');
      if (activeStation) {
        activeStation.triggered = true;
        activeStation = null;
      }
    };

    document.getElementById('confirmBtn').onclick = () => {
      const selected = activeStation.name;
      modalDesc.innerText = "جاري إرسال الإشارة لطاقم الضيافة...";
      
      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          المشروب_المطلوب: selected,
          التوقيت: new Date().toLocaleTimeString('ar-EG'),
          الموقع: "رصيف الضيافة الملاحي"
        })
      }).then(() => {
        alert(`تم طلب (${selected}) بنجاح! سيصلك لمكانك حالاً ⚓`);
        modal.classList.remove('active');
        activeStation.triggered = true;
        activeStation = null;
      }).catch(() => {
        alert("تعذر الإرسال، يرجى المحاولة مرة أخرى.");
        modal.classList.remove('active');
        activeStation = null;
      });
    };

    function update() {
      const canalLeftLimit = width * 0.24;
      const canalRightLimit = width * 0.76;

      if (!activeStation) {
        // حركة للأمام
        if (ship.movingUp) {
          cameraY -= ship.speed;
          // توليد أثر الماء خلف المحرك
          ship.wake.push({
            x: ship.x + (Math.random() * 6 - 3),
            y: ship.y + cameraY + ship.height / 2,
            size: 4,
            alpha: 0.6
          });
        }

        // الانعطاف والدوران الديناميكي
        if (ship.movingLeft) {
          if (ship.x > canalLeftLimit) ship.x -= ship.speed * 0.8;
          ship.angle = Math.max(ship.angle - ship.turnSpeed, -Math.PI / 2 - 0.4);
        } else if (ship.movingRight) {
          if (ship.x < canalRightLimit) ship.x += ship.speed * 0.8;
          ship.angle = Math.min(ship.angle + ship.turnSpeed, -Math.PI / 2 + 0.4);
        } else {
          // العودة للوضع الرأسي بسلاسة
          ship.angle += (-Math.PI / 2 - ship.angle) * 0.1;
        }
      }

      ctx.clearRect(0, 0, width, height);
      drawCanal();
      drawShipWake();
      drawStations();
      drawShip();

      requestAnimationFrame(update);
    }

    // إعدادات أزرار التحكم باللمس والكيبورد
    const bindBtn = (id, prop) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); ship[prop] = true; });
      el.addEventListener('pointerup', () => ship[prop] = false);
      el.addEventListener('pointerleave', () => ship[prop] = false);
    };

    bindBtn('upBtn', 'movingUp');
    bindBtn('leftBtn', 'movingLeft');
    bindBtn('rightBtn', 'movingRight');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') ship.movingUp = true;
      if (e.key === 'ArrowLeft') ship.movingLeft = true;
      if (e.key === 'ArrowRight') ship.movingRight = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp') ship.movingUp = false;
      if (e.key === 'ArrowLeft') ship.movingLeft = false;
      if (e.key === 'ArrowRight') ship.movingRight = false;
    });

    update();
  </script>
</body>
</html>
