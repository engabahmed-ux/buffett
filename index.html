<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ملاحة بوفيه قناة السويس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background-color: #e2c99a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .hud {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 37, 64, 0.88);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      z-index: 5;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .controls {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 55px);
      gap: 10px;
      z-index: 10;
      justify-content: center;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      border: 2px solid #0d47a1;
      border-radius: 16px;
      font-size: 22px;
      color: #0d47a1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      touch-action: none;
    }
    .ctrl-btn:active {
      background: #0d47a1;
      color: white;
    }
    #upBtn { grid-column: 2; grid-row: 1; }
    #leftBtn { grid-column: 1; grid-row: 2; }
    #downBtn { grid-column: 2; grid-row: 2; }
    #rightBtn { grid-column: 3; grid-row: 2; }

    .toss-btn {
      display: none;
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 34px;
      background: linear-gradient(135deg, #d32f2f, #b71c1c);
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid #fff;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      z-index: 15;
      cursor: pointer;
    }
    .status-toast {
      display: none;
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(198, 40, 40, 0.95);
      color: white;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <div class="hud" id="gameHud">⚓ قُد سفينتك بحرية واقترب من أي رصيف مشروب للرسو</div>
  <div class="status-toast" id="statusToast">❌ لم يصب الهلب! حاول مجدداً</div>
  <canvas id="gameCanvas"></canvas>

  <div class="controls" id="navControls">
    <button class="ctrl-btn" id="upBtn">▲</button>
    <button class="ctrl-btn" id="leftBtn">◀</button>
    <button class="ctrl-btn" id="downBtn">▼</button>
    <button class="ctrl-btn" id="rightBtn">▶</button>
  </div>

  <button class="toss-btn" id="tossBtn">⚓ ارمِ الهلب للتثبيت!</button>

  <script>
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID"; // استبدل برابطك الخاص

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('gameHud');
    const toast = document.getElementById('statusToast');
    const navControls = document.getElementById('navControls');
    const tossBtn = document.getElementById('tossBtn');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const ship = {
      worldX: width / 2,
      worldY: 0,
      width: 38,
      height: 68,
      speed: 0,
      maxForwardSpeed: 3.6,
      maxReverseSpeed: -2.2,
      turnSpeed: 0.045,
      angle: -Math.PI / 2,
      movingForward: false,
      movingBackward: false,
      movingLeft: false,
      movingRight: false,
      wake: []
    };

    const stations = [
      { id: 1, name: "شاي كشري مزموق", icon: "☕", color: "#6d4c41", side: "right", worldY: -200, dockCooldown: 0 },
      { id: 2, name: "قهوة تركي مظبوط", icon: "☕", color: "#4e342e", side: "left", worldY: -650, dockCooldown: 0 },
      { id: 3, name: "إسبريسو دبل", icon: "🥃", color: "#3e2723", side: "right", worldY: -1100, dockCooldown: 0 },
      { id: 4, name: "عصير مانجو فريش", icon: "🍹", color: "#ff8f00", side: "left", worldY: -1550, dockCooldown: 0 },
      { id: 5, name: "ليمون نعناع مثلج", icon: "🍋", color: "#2e7d32", side: "right", worldY: -2000, dockCooldown: 0 },
      { id: 6, name: "مياه معدنية مثلجة", icon: "🧊", color: "#0288d1", side: "left", worldY: -2450, dockCooldown: 0 }
    ];

    let gameState = "SAILING"; // "SAILING" | "AIMING" | "TOSSING" | "DOCKED"
    let activeStation = null;
    let waterOffset = 0;
    let pulseAngle = 0;

    // إعدادات التنشين (هادئة وسلسة)
    const anchorGame = {
      angle: 0,
      swingSpeed: 0.022, // سرعة تأرجح هادئة
      swingLimit: 0.55,
      anchorDist: 0,
      tossSpeed: 4.8,    // سرعة رمي مرئية وواضحة
      targetX: 0,
      targetY: 0,
      targetRadius: 28
    };

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    function drawCanal() {
      const canalLeft = width * 0.22;
      const canalWidth = width * 0.56;
      const canalRight = canalLeft + canalWidth;

      // رمال الضفتين
      const sandGrad = ctx.createLinearGradient(0, 0, width, 0);
      sandGrad.addColorStop(0, '#e4c483');
      sandGrad.addColorStop(0.2, '#d9b66c');
      sandGrad.addColorStop(0.8, '#d9b66c');
      sandGrad.addColorStop(1, '#e4c483');
      ctx.fillStyle = sandGrad;
      ctx.fillRect(0, 0, width, height);

      // مياه القناة المتدرجة
      const waterGrad = ctx.createLinearGradient(canalLeft, 0, canalRight, 0);
      waterGrad.addColorStop(0, '#026aa7');
      waterGrad.addColorStop(0.5, '#0288d1');
      waterGrad.addColorStop(1, '#026aa7');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(canalLeft, 0, canalWidth, height);

      // أمواج تفاعلية
      waterOffset += 0.025;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 2;
      for (let y = 0; y < height; y += 45) {
        ctx.beginPath();
        const wave = Math.sin(waterOffset + y * 0.04) * 8;
        ctx.moveTo(canalLeft, y);
        ctx.bezierCurveTo(canalLeft + canalWidth * 0.3 + wave, y - 5, canalLeft + canalWidth * 0.7 - wave, y + 5, canalRight, y);
        ctx.stroke();
      }

      // خط المنتصف الملاحي
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.setLineDash([20, 15]);
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawShipWake() {
      for (let i = 0; i < ship.wake.length; i++) {
        const p = ship.wake[i];
        p.alpha -= 0.015;
        p.size += 0.4;
        if (p.alpha > 0) {
          ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y - (ship.worldY - height * 0.7), p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ship.wake = ship.wake.filter(p => p.alpha > 0);
    }

    function drawStations() {
      const cameraY = ship.worldY - height * 0.7;
      pulseAngle += 0.04;
      const pulseGlow = Math.sin(pulseAngle) * 5 + 8;

      stations.forEach(st => {
        const renderY = st.worldY - cameraY;
        const isLeft = st.side === 'left';
        const canalEdge = isLeft ? (width * 0.22) : (width * 0.78);
        const dockWidth = 100;
        const dockHeight = 74;
        const drawX = isLeft ? canalEdge - dockWidth - 8 : canalEdge + 8;

        if (renderY > -100 && renderY < height + 100) {
          ctx.save();
          // ظل وتوهج
          ctx.shadowColor = st.color;
          ctx.shadowBlur = pulseGlow;
          
          // رصيف الميناء ثلاثي الأبعاد
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = st.color;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.roundRect(drawX, renderY - dockHeight / 2, dockWidth, dockHeight, 14);
          ctx.fill();
          ctx.stroke();

          // شريط زخرفي علوي
          ctx.fillStyle = st.color;
          ctx.beginPath();
          ctx.roundRect(drawX, renderY - dockHeight / 2, dockWidth, 8, [14, 14, 0, 0]);
          ctx.fill();

          // أيقونة المشروب
          ctx.font = '24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(st.icon, drawX + dockWidth / 2, renderY + 4);

          // اسم المشروب
          ctx.fillStyle = '#0a2540';
          ctx.font = 'bold 11px Tahoma';
          ctx.fillText(st.name, drawX + dockWidth / 2, renderY + 24);
          ctx.restore();

          // تحديث فترة الانتظار (Cooldown) لإعادة الطلب
          if (st.dockCooldown > 0) st.dockCooldown--;

          // بدء طور التنشين إذا اقتربت السفينة
          const dockCenterX = isLeft ? canalEdge : canalEdge;
          const dist = Math.hypot(ship.worldX - dockCenterX, ship.worldY - st.worldY);

          if (dist < 88 && gameState === "SAILING" && st.dockCooldown === 0) {
            startAnchorGame(st, isLeft ? canalEdge - 50 : canalEdge + 50, renderY);
          }
        }
      });
    }

    function drawShip() {
      const screenX = ship.worldX;
      const screenY = height * 0.7;

      ctx.save();
      ctx.translate(screenX, screenY);
      ctx.rotate(ship.angle + Math.PI / 2);

      // ظل المركب في الماء
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 4;

      // بدن المركب
      ctx.fillStyle = '#d32f2f';
      ctx.beginPath();
      ctx.moveTo(0, -ship.height / 2);
      ctx.bezierCurveTo(ship.width / 2, -ship.height / 4, ship.width / 2, ship.height / 2, 0, ship.height / 2);
      ctx.bezierCurveTo(-ship.width / 2, ship.height / 2, -ship.width / 2, -ship.height / 4, 0, -ship.height / 2);
      ctx.fill();
      ctx.strokeStyle = '#801313';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // مقصورة القيادة
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(-ship.width / 3.5, -ship.height / 5, ship.width / 1.75, ship.height / 2.3, 4);
      ctx.fill();
      ctx.strokeStyle = '#0d47a1';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // مدخنة
      ctx.fillStyle = '#212121';
      ctx.beginPath();
      ctx.arc(0, ship.height / 8, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function startAnchorGame(station, targetX, targetY) {
      gameState = "AIMING";
      activeStation = station;
      anchorGame.targetX = targetX;
      anchorGame.targetY = targetY;
      anchorGame.anchorDist = 0;
      anchorGame.angle = 0;

      navControls.style.display = 'none';
      tossBtn.style.display = 'block';
      hud.innerText = `🎯 اضغط "ارمِ الهلب" عندما يصوب السهم نحو حلقة (${station.name})!`;
    }

    function drawAnchorMinigame() {
      const isLeft = activeStation.side === 'left';
      const startX = ship.worldX;
      const startY = height * 0.7;

      // 1. حلقة التثبيت بالرصيف
      ctx.save();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#f57c00';
      ctx.fillStyle = 'rgba(255, 179, 0, 0.35)';
      ctx.beginPath();
      ctx.arc(anchorGame.targetX, anchorGame.targetY, anchorGame.targetRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // مسمار الربط
      ctx.fillStyle = '#37474f';
      ctx.beginPath();
      ctx.arc(anchorGame.targetX, anchorGame.targetY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 2. تأرجح زاوية التنشين
      if (gameState === "AIMING") {
        anchorGame.angle += anchorGame.swingSpeed;
        if (Math.abs(anchorGame.angle) > anchorGame.swingLimit) {
          anchorGame.swingSpeed *= -1;
        }
      }

      const baseAngle = isLeft ? Math.PI : 0;
      const currentAngle = baseAngle + anchorGame.angle;

      // 3. خط التصويب
      if (gameState === "AIMING") {
        ctx.strokeStyle = 'rgba(255, 235, 59, 0.75)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(startX + Math.cos(currentAngle) * 150, startY + Math.sin(currentAngle) * 150);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 4. رسم الهلب والحبل
      const currentDist = gameState === "TOSSING" ? anchorGame.anchorDist : 20;
      const anchorX = startX + Math.cos(currentAngle) * currentDist;
      const anchorY = startY + Math.sin(currentAngle) * currentDist;

      ctx.strokeStyle = '#4e342e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(anchorX, anchorY);
      ctx.stroke();

      ctx.save();
      ctx.translate(anchorX, anchorY);
      ctx.rotate(currentAngle);
      ctx.font = '26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚓', 0, 0);
      ctx.restore();

      // 5. التحقق من الإصابة
      if (gameState === "TOSSING") {
        anchorGame.anchorDist += anchorGame.tossSpeed;
        const maxDist = Math.hypot(anchorGame.targetX - startX, anchorGame.targetY - startY);

        if (anchorGame.anchorDist >= maxDist) {
          const hitDist = Math.hypot(anchorX - anchorGame.targetX, anchorY - anchorGame.targetY);
          if (hitDist <= anchorGame.targetRadius + 10) {
            handleSuccess();
          } else {
            handleFailure();
          }
        }
      }
    }

    tossBtn.onclick = () => {
      if (gameState === "AIMING") {
        gameState = "TOSSING";
        tossBtn.style.display = 'none';
      }
    };

    function handleSuccess() {
      gameState = "DOCKED";
      const selected = activeStation.name;
      hud.innerText = `🎉 تم التثبيت بنجاح! جاري إرسال طلب (${selected})...`;

      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          الطلب: selected,
          الرسو: "تثبيت ناجح بالهلب",
          الوقت: new Date().toLocaleTimeString('ar-EG')
        })
      }).then(() => {
        setTimeout(() => {
          alert(`تم تثبيت المركب وإرسال طلب (${selected}) للصالون بنجاح! ☕⚓`);
          activeStation.dockCooldown = 250; // تبريد بسيط لمنع التكرار الفوري
          resumeSailing();
        }, 300);
      }).catch(() => {
        alert(`تم تثبيت السفينة لـ (${selected})!`);
        activeStation.dockCooldown = 250;
        resumeSailing();
      });
    }

    function handleFailure() {
      gameState = "DOCKED";
      showToast("❌ لم يصب الهلب حلقة الرسو! حاول مجدداً");
      setTimeout(() => {
        gameState = "AIMING";
        anchorGame.anchorDist = 0;
        tossBtn.style.display = 'block';
        hud.innerText = `🎯 ركز وحاول مجدداً رمي الهلب في الحلقة!`;
      }, 1000);
    }

    function resumeSailing() {
      gameState = "SAILING";
      activeStation = null;
      tossBtn.style.display = 'none';
      navControls.style.display = 'grid';
      hud.innerText = "⚓ تابع الإبحار بحرية، يمكنك الالتفاف والعودة لأي مشروب";
    }

    function update() {
      const canalLeftLimit = width * 0.25;
      const canalRightLimit = width * 0.75;

      if (gameState === "SAILING") {
        // حركة للأمام / للخلف
        if (ship.movingForward) {
          ship.speed = Math.min(ship.speed + 0.2, ship.maxForwardSpeed);
        } else if (ship.movingBackward) {
          ship.speed = Math.max(ship.speed - 0.2, ship.maxReverseSpeed);
        } else {
          ship.speed *= 0.94; // احتكاك الماء التلقائي
        }

        // الدوران والالتفاف الكامل (360 درجة)
        if (ship.movingLeft) ship.angle -= ship.turnSpeed;
        if (ship.movingRight) ship.angle += ship.turnSpeed;

        // تطبيق السرعة في اتجاه زاوية السفينة
        ship.worldX += Math.cos(ship.angle) * ship.speed;
        ship.worldY += Math.sin(ship.angle) * ship.speed;

        // حواف القناة المائية
        if (ship.worldX < canalLeftLimit) ship.worldX = canalLeftLimit;
        if (ship.worldX > canalRightLimit) ship.worldX = canalRightLimit;

        // رغوة محرك السفينة
        if (Math.abs(ship.speed) > 0.8) {
          ship.wake.push({
            x: ship.worldX - Math.cos(ship.angle) * (ship.height / 2),
            y: ship.worldY - Math.sin(ship.angle) * (ship.height / 2),
            size: 3.5,
            alpha: 0.55
          });
        }
      }

      ctx.clearRect(0, 0, width, height);
      drawCanal();
      drawShipWake();
      drawStations();
      drawShip();

      if (gameState !== "SAILING" && activeStation) {
        drawAnchorMinigame();
      }

      requestAnimationFrame(update);
    }

    // ربط أزرار التحكم
    const bindBtn = (id, prop) => {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); ship[prop] = true; });
      el.addEventListener('pointerup', () => ship[prop] = false);
      el.addEventListener('pointerleave', () => ship[prop] = false);
    };

    bindBtn('upBtn', 'movingForward');
    bindBtn('downBtn', 'movingBackward');
    bindBtn('leftBtn', 'movingLeft');
    bindBtn('rightBtn', 'movingRight');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') ship.movingForward = true;
      if (e.key === 'ArrowDown' || e.key === 's') ship.movingBackward = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') ship.movingLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd') ship.movingRight = true;
      if (e.key === ' ' && gameState === "AIMING") tossBtn.click();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') ship.movingForward = false;
      if (e.key === 'ArrowDown' || e.key === 's') ship.movingBackward = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') ship.movingLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd') ship.movingRight = false;
    });

    update();
  </script>
</body>
</html>
